spring.application.name=mwe-treino-api

# ==========================================
# ConexÃ£o com Banco de Dados (Docker PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mew_treino
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configurações JPA / Hibernate
# ==========================================
# 'update': cria e atualiza as tabelas automaticamente sem apagar dados existentes
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL formatadas no console para facilitar o aprendizado e debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Boa prÃ¡tica de performance e controle transacional
spring.jpa.open-in-view=false

#importando o .env
spring.config.import=optional:file:.env[.properties]

#google
google.client.id=${GOOGLE_CLIENT_ID}

#Secret Key
jwt.secret=${JWT_SECRET}