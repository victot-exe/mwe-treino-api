spring.application.name=mwe-treino-api

# ==========================================
# Conexão com Banco de Dados (Docker PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mew_treino
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configurações JPA / Hibernate
# ==========================================
# 'update': cria e atualiza as tabelas automaticamente sem apagar dados existentes
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL formatadas no console para facilitar o aprendizado e debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Boa prática de performance e controle transacional
spring.jpa.open-in-view=false
