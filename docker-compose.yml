services:
  postgres:
    image: postgres:16-alpine
    container_name: mew_treino_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mew_treino
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mew_treino_postgres_data:/var/lib/postgresql/data

volumes:
  mew_treino_postgres_data:
